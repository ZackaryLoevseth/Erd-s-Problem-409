name: Verify F=68 certificate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify SHA-256 manifest
        run: python verify_manifest.py
      - name: Verify explicit certificate
        run: python verify_certificate.py
      - name: Verify all recursive prime certificates
        run: python verify_pratt.py
      - name: Independent factor-from-scratch recomputation
        run: python independent_check.py
      - name: Install SymPy
        run: python -m pip install -r requirements.txt
      - name: Minimal SymPy verification
        run: python verify.py
